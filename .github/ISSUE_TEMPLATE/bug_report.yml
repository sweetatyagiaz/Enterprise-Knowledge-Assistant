name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private documents, or personal data."

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and commit/version.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials and sensitive document contents.
