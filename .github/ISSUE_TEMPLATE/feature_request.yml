name: Feature request
description: Propose an improvement.
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user need would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and evaluation
      description: Include security, privacy, compatibility, and testing considerations.
